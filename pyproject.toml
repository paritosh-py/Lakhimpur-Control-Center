[project]
name = "lakhimpur-flood-response"
version = "0.1.0"
description = "Local flood response prototype for Lakhimpur, Assam"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "PyYAML>=6,<7",
    "osmnx>=2,<3",
    "rasterio>=1.4,<2",
    "pypdf>=5,<7",
    "pymupdf>=1.25,<2",
    "osmium>=4,<5",
    "truststore>=0.10,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_temp"
